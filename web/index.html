<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bouquet ordering and delivery from Bloom &amp; Bunch KL.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bloom &amp; Bunch KL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2"/>

  <title>Bloom &amp; Bunch KL</title>
  <link rel="manifest" href="manifest.json">
  <!-- API KEY -->
  <script>
    // Authorization errors arrive after the SDK callback, once a map is made.
    // Notify Flutter as well as rejecting any subsequent attempt to use it.
    window.gm_authFailure = function () {
      window.bloomMapsFailure = 'authorization';
      window.dispatchEvent(new Event('bloom-maps-error'));
    };
    window.bloomLoadMaps = function (providedKey) {
      if (window.bloomMapsFailure) return Promise.reject(new Error('Maps authorization failed'));
      if (window.bloomMapsPromise) return window.bloomMapsPromise;
      if (window.google && window.google.maps && typeof window.google.maps.Map === 'function') return Promise.resolve(true);
      const configuredKey = '%%MAPS_API_KEY_WEB%%';
      const key = providedKey || (configuredKey.includes('%%') ? '' : configuredKey);
      if (!key) return Promise.reject(new Error('Maps web configuration missing'));
      window.bloomMapsPromise = new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.async = true;
        const timer = setTimeout(failed, 20000);
        function failed() {
          clearTimeout(timer);
          script.remove();
          window.bloomMapsPromise = null;
          reject(new Error('Maps could not load'));
        }
        window.bloomMapsLoaded = function () {
          if (!window.google || !window.google.maps || typeof window.google.maps.Map !== 'function') { failed(); return; }
          clearTimeout(timer);
          resolve(true);
        };
        script.onerror = failed;
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&callback=bloomMapsLoaded&loading=async';
        document.head.appendChild(script);
      });
      return window.bloomMapsPromise;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
