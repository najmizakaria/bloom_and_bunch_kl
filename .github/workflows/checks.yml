name: Project checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - run: touch .env && flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: npm ci --prefix functions
      - run: npm install --global firebase-tools@15.30.0
      - run: firebase emulators:exec --project demo-bloom --only auth,firestore,storage "npm --prefix functions run test:emulators"
      - run: flutter build web --dart-define=APP_ENV=demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web-build
          path: build/web
  app-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true
      - uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - run: touch .env && flutter pub get && npm ci --prefix functions
      - run: npm install --global firebase-tools@15.30.0
      - run: chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
      - run: firebase emulators:exec --project demo-bloom --only auth,firestore,storage,functions "node tool/run_app_journey.cjs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-debug-logs
          path: '*-debug.log'
